name: Backtest LGIM
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy openpyxl reportlab
      - name: Scarica i prezzi ed esegui il backtest
        run: python scripts/backtest.py
      - name: Salva i risultati
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/backtest.json data/backtest_lgim.xlsx
          git diff --staged --quiet || (git commit -m "Backtest LGIM" && git pull --rebase origin ${{ github.ref_name }} && git push)
