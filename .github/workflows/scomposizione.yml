name: Scomposizione LGIM
on:
  workflow_dispatch:
concurrency:
  group: scomposizione
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scomposizione:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy openpyxl reportlab
      - name: Scarica i prezzi ed esegui la scomposizione
        run: python scomposizione.py
      - name: Salva i risultati
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/scomposizione.json data/scomposizione_lgim.xlsx
          git diff --staged --quiet || (git commit -m "Scomposizione LGIM" && git pull --rebase origin ${{ github.ref_name }} && git push)
